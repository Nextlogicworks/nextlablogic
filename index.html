<!DOCTYPE html>
<html>
<head>
<style>
body{backround-color:#050805;}
h1,p{color:white;}
a{color:blue;}
.robot-dashboard{
  font-size: 24px;text-align: center; display: block; margin-top: 150px;}
.weather-information{
  font-size: 24px;text-align: center; display: block; margin-top: 600px;}
#matrix {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}
</style>
<title>Next Logic Works</title>
</head> 
<body>
<canvas id="matrix">
</canvas>
<script>
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const letters = "ABC6DE3FGHIJKLMNO13P4QRSTUV35WXYZ0#6123456#6789";
const fontSize = 14;
const columns = Math.floor(canvas.width / fontSize);
const drops = [];
let i = 0;
while (i < columns) {
  drops[i] = 1 ;
  i++;
}
function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff00";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];

        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}
setInterval(drawMatrix, 130);
</script>
<h1>Welcome to Next Lab Logic </h1>

</body>
</html>
